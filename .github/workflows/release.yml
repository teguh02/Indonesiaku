name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v0.1.1
  workflow_dispatch:

jobs:
  build-artifacts:
    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      # Satu OS gagal TIDAK boleh membatalkan build OS lain: rilis v1.0.0
      # kehilangan seluruh binari karena macOS merah lalu Linux/Windows
      # dibatalkan di tengah jalan.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: indk-linux
            # -march=x86-64 (baseline) WAJIB untuk artefak rilis: runner
            # GitHub mengompilasi ke x86-64-v3 (butuh AVX2), sehingga binari
            # v1.1.0 dan v1.2.0 mati dengan "CPU ISA level is lower than
            # required" di CPU lawas dan banyak VPS/KVM. Dipakai lewat
            # EXTRA_CFLAGS, bukan CFLAGS=, supaya -O2/-Isrc tidak tertimpa.
            build_cmd: make clean && make EXTRA_CFLAGS=-march=x86-64
            extra_cflags: -march=x86-64

          - os: macos-latest
            artifact_name: indk-macos
            extra_cflags: ''
            # TANPA -march: runner macos-latest adalah arm64 (artefak v1.2.0
            # terbukti "Mach-O 64-bit arm64"), dan -march=x86-64 bukan nilai
            # sah untuk target ARM sehingga build gagal total.
            build_cmd: make clean && make
            
          - os: windows-latest
            artifact_name: indk-windows.exe

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MinGW (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install mingw make -y
          refreshenv
          gcc --version
          make --version
        continue-on-error: true

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: ${{ matrix.build_cmd }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # PowerShell 5 (bawaan windows-latest) TIDAK mengenal '&&' sebagai
          # pemisah perintah, jadi 'make clean && make' gagal parse sebelum
          # kompilasi dimulai. Dipisah jadi dua baris.
          make clean
          # Lihat catatan -march pada matrix ubuntu: runner Windows juga x86_64
          # dan tanpa ini .exe rilis menuntut AVX2.
          make EXTRA_CFLAGS=-march=x86-64

      - name: Verify binary
        if: runner.os != 'Windows'
        run: |
          ./indk -v
          file ./indk

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\indk.exe -v
          Get-Item .\indk.exe

      - name: Run test suite (Linux/macOS)
        if: runner.os != 'Windows'
        # test_all.sh melakukan 'make clean && make' sendiri. Tanpa
        # meneruskan EXTRA_CFLAGS, rebuild itu MENIMPA binari ber-march
        # dan artefak rilis kembali menuntut AVX2.
        env:
          EXTRA_CFLAGS: ${{ matrix.extra_cflags }}
        run: |
          chmod +x tests/test_all.sh
          bash tests/test_all.sh

      - name: Run test suite (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests/test_all.ps1

      - name: Normalkan penanda ISA (Linux)
        if: runner.os == 'Linux'
        # Walau SETIAP perintah kompilasi memakai -march=x86-64, binari hasil
        # link tetap bertanda 'x86 ISA needed: ...x86-64-v3' dan ditolak
        # loader di CPU tanpa AVX2. Penandanya PALSU: objdump memastikan
        # binari ini nol instruksi ymm/zmm. Penanda itu ikut dari objek
        # startup glibc milik image runner, bukan dari kode kita.
        #
        # Membuang .note.gnu.property menghilangkan penanda tersebut. Ini
        # JUGA membuang penanda CET (IBT/SHSTK) — trade-off yang diterima
        # sadar: binari yang jalan di mesin pengguna lebih berharga daripada
        # penanda hardening pada binari yang tidak bisa dijalankan.
        #
        # Guard di bawah membuat build GAGAL kalau penandanya masih menuntut
        # v2/v3, supaya rilis cacat tidak terbit diam-diam untuk ketiga
        # kalinya (v1.2.0 dan v1.3.0 sudah terbit rusak).
        run: |
          set -e
          if objdump -d indk | grep -qE '%ymm|%zmm'; then
            echo "GAGAL: binari benar-benar memakai AVX2; penanda ISA sah."
            echo "Jangan buang penandanya — perbaiki flag kompilasi dulu."
            exit 1
          fi
          objcopy --remove-section=.note.gnu.property indk
          if readelf -n indk | grep -q 'x86-64-v[234]'; then
            echo "GAGAL: penanda ISA masih menuntut di atas baseline:"
            readelf -n indk | grep 'ISA needed'
            exit 1
          fi
          echo "OK: penanda ISA baseline."
          ./indk -v

      - name: Kemas rilis (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          PKG="${{ matrix.artifact_name }}"
          mkdir -p "dist/$PKG"
          cp indk "dist/$PKG/"
          cp -r pustaka examples "dist/$PKG/"
          cp README.md CHANGELOG.md LICENSE "dist/$PKG/" 2>/dev/null || true
          cp docs/SPESIFIKASI.md "dist/$PKG/" 2>/dev/null || true
          cd dist && tar -czf "$PKG.tar.gz" "$PKG"
          ls -lh "$PKG.tar.gz"

      - name: Bangun paket .deb (Linux saja)
        if: matrix.artifact_name == 'indk-linux'
        run: |
          # Tag "v1.4.0" -> versi paket "1.4.0"; dpkg menolak awalan huruf.
          VERSI="${GITHUB_REF#refs/tags/}"
          VERSI="${VERSI#v}"
          if [ -z "$VERSI" ]; then VERSI="$(./indk -v | tr -d '[:space:]')"; fi
          bash packaging/deb/bangun.sh "$VERSI" amd64 indk "dist/indonesiaku_${VERSI}_amd64.deb"
          # Paket harus benar-benar dapat dipasang, bukan sekadar terbentuk.
          sudo dpkg -i "dist/indonesiaku_${VERSI}_amd64.deb"
          cd /tmp && printf 'impor json\ncetak("stdlib ok")\n' > u.idk && indk u.idk
          sudo dpkg -r indonesiaku

      - name: Kemas rilis (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $pkg = "indk-windows"
          New-Item -ItemType Directory -Force -Path "dist/$pkg" | Out-Null
          Copy-Item indk.exe "dist/$pkg/"
          Copy-Item -Recurse pustaka,examples "dist/$pkg/"
          foreach ($f in @("README.md","CHANGELOG.md","LICENSE","docs/SPESIFIKASI.md")) {
            if (Test-Path $f) { Copy-Item $f "dist/$pkg/" }
          }
          # Compress-Archive (PowerShell 5) menulis pemisah path '\' di dalam
          # arsip, melanggar spec ZIP: 'unzip' di Linux/macOS lalu menghasilkan
          # berkas datar bernama 'indk-windows\indk.exe'. 7z sudah terpasang
          # di runner dan menulis '/' yang benar.
          # 7z menyimpan path APA ADANYA, jadi "dist/$pkg" menaruh lapisan
          # 'dist/' berlebih di dalam arsip. Masuk ke dist/ dulu agar isinya
          # 'indk-windows/indk.exe', sejajar dengan paket Linux/macOS.
          Push-Location dist
          7z a -tzip "$pkg.zip" "$pkg" | Out-Null
          Pop-Location
          Get-Item "dist/$pkg.zip"

      - name: Bangun installer Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $versi = "$env:GITHUB_REF" -replace '^refs/tags/v?', ''
          if (-not $versi) { $versi = (& ./indk.exe -v).Trim() }
          # Inno Setup tidak terpasang di runner windows-latest.
          choco install innosetup --no-progress -y | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DVersiApp=$versi" "packaging\windows\indonesiaku.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC gagal dengan kode $LASTEXITCODE" }
          Get-Item "dist/Indonesiaku-Setup-$versi.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/Indonesiaku-Setup-*.exe
          retention-days: 90

  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    continue-on-error: true  # Don't fail release if Docker push fails
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Extract version from tag
        id: meta
        run: |
          # Tag git memakai awalan 'v' (v1.0.0), tag image TIDAK (1.0.0) —
          # samakan dengan tag yang sudah ada di Docker Hub (0.4.0, 1.0.0),
          # jika tidak setiap rilis menghasilkan dua tag untuk versi yang sama.
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building Docker image for version: ${VERSION}"

      - name: Login to Docker Hub
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Build and Push Docker image
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/images/Dockerfile
          push: true
          tags: |
            teguh02/indonesiaku:latest
            teguh02/indonesiaku:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

      - name: Build Docker image (no push - no secrets)
        if: env.DOCKER_USERNAME == '' || env.DOCKER_PASSWORD == ''
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/images/Dockerfile
          push: false
          tags: |
            teguh02/indonesiaku:latest
            teguh02/indonesiaku:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Kumpulkan berkas rilis
        run: |
          mkdir -p rilis
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name 'Indonesiaku-Setup-*.exe' \) -exec cp {} rilis/ \;
          cd rilis
          sha256sum * > SHA256SUMS.txt
          ls -lh
          # Rilis tanpa binari adalah kegagalan diam-diam: hentikan di sini.
          test "$(ls *.tar.gz *.zip 2>/dev/null | wc -l)" -ge 3 \
            || { echo "::error::Kurang dari 3 paket OS; rilis dibatalkan."; exit 1; }
          # Paket native dijanjikan di panduan instalasi dan disarankan oleh
          # `indk --periksa-pembaruan`; bila hilang, pengguna diarahkan ke
          # URL 404. Periksa keduanya secara terpisah.
          ls indonesiaku_*_amd64.deb >/dev/null 2>&1 \
            || { echo "::error::Paket .deb tidak ada; rilis dibatalkan."; exit 1; }
          ls Indonesiaku-Setup-*.exe >/dev/null 2>&1 \
            || { echo "::error::Installer Windows tidak ada; rilis dibatalkan."; exit 1; }

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: "Indonesiaku ${{ steps.version.outputs.version }}"
          artifacts: "rilis/*"
          allowUpdates: true
          # Jangan menimpa catatan rilis yang sudah ditulis tangan.
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}

  notify-completion:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    if: always()
    continue-on-error: true
    
    steps:
      - name: Print summary
        run: |
          echo "::group::Release Build Summary"
          echo "Build Status: completed"
          echo "Artifacts: Linux, macOS, Windows"
          echo "::endgroup::"
