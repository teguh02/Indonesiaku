name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v0.1.1
  workflow_dispatch:

jobs:
  build-artifacts:
    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      # Satu OS gagal TIDAK boleh membatalkan build OS lain: rilis v1.0.0
      # kehilangan seluruh binari karena macOS merah lalu Linux/Windows
      # dibatalkan di tengah jalan.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: indk-linux
            build_cmd: make clean && make
            
          - os: macos-latest
            artifact_name: indk-macos
            build_cmd: make clean && make
            
          - os: windows-latest
            artifact_name: indk-windows.exe

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MinGW (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install mingw make -y
          refreshenv
          gcc --version
          make --version
        continue-on-error: true

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: ${{ matrix.build_cmd }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # PowerShell 5 (bawaan windows-latest) TIDAK mengenal '&&' sebagai
          # pemisah perintah, jadi 'make clean && make' gagal parse sebelum
          # kompilasi dimulai. Dipisah jadi dua baris.
          make clean
          make

      - name: Verify binary
        if: runner.os != 'Windows'
        run: |
          ./indk -v
          file ./indk

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\indk.exe -v
          Get-Item .\indk.exe

      - name: Run test suite (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x tests/test_all.sh
          bash tests/test_all.sh

      - name: Run test suite (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests/test_all.ps1

      - name: Kemas rilis (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          PKG="${{ matrix.artifact_name }}"
          mkdir -p "dist/$PKG"
          cp indk "dist/$PKG/"
          cp -r pustaka examples "dist/$PKG/"
          cp README.md CHANGELOG.md LICENSE "dist/$PKG/" 2>/dev/null || true
          cp docs/SPESIFIKASI.md "dist/$PKG/" 2>/dev/null || true
          cd dist && tar -czf "$PKG.tar.gz" "$PKG"
          ls -lh "$PKG.tar.gz"

      - name: Kemas rilis (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $pkg = "indk-windows"
          New-Item -ItemType Directory -Force -Path "dist/$pkg" | Out-Null
          Copy-Item indk.exe "dist/$pkg/"
          Copy-Item -Recurse pustaka,examples "dist/$pkg/"
          foreach ($f in @("README.md","CHANGELOG.md","LICENSE","docs/SPESIFIKASI.md")) {
            if (Test-Path $f) { Copy-Item $f "dist/$pkg/" }
          }
          # Compress-Archive (PowerShell 5) menulis pemisah path '\' di dalam
          # arsip, melanggar spec ZIP: 'unzip' di Linux/macOS lalu menghasilkan
          # berkas datar bernama 'indk-windows\indk.exe'. 7z sudah terpasang
          # di runner dan menulis '/' yang benar.
          7z a -tzip "dist/$pkg.zip" "dist/$pkg" | Out-Null
          Get-Item "dist/$pkg.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 90

  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    continue-on-error: true  # Don't fail release if Docker push fails
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Extract version from tag
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building Docker image for version: ${VERSION}"

      - name: Login to Docker Hub
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Build and Push Docker image
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/images/Dockerfile
          push: true
          tags: |
            teguh02/indonesiaku:latest
            teguh02/indonesiaku:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

      - name: Build Docker image (no push - no secrets)
        if: env.DOCKER_USERNAME == '' || env.DOCKER_PASSWORD == ''
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/images/Dockerfile
          push: false
          tags: |
            teguh02/indonesiaku:latest
            teguh02/indonesiaku:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Kumpulkan berkas rilis
        run: |
          mkdir -p rilis
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} rilis/ \;
          cd rilis
          sha256sum * > SHA256SUMS.txt
          ls -lh
          # Rilis tanpa binari adalah kegagalan diam-diam: hentikan di sini.
          test "$(ls *.tar.gz *.zip 2>/dev/null | wc -l)" -ge 3 \
            || { echo "::error::Kurang dari 3 paket OS; rilis dibatalkan."; exit 1; }

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: "Indonesiaku ${{ steps.version.outputs.version }}"
          artifacts: "rilis/*"
          allowUpdates: true
          # Jangan menimpa catatan rilis yang sudah ditulis tangan.
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}

  notify-completion:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    if: always()
    continue-on-error: true
    
    steps:
      - name: Print summary
        run: |
          echo "::group::Release Build Summary"
          echo "Build Status: completed"
          echo "Artifacts: Linux, macOS, Windows"
          echo "::endgroup::"
