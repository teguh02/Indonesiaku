  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="assets/indonesiaku-hljs.js?v=1.1.0"></script>
  <script>
    (function () {
    "use strict";
    function mulai() {
    // ----------------------------------------------------------------
    // Daftar dokumen (berkas .md di folder panduan/). Urutan = sidebar.
    // ----------------------------------------------------------------
    const DOCS = [
      { file: "panduan/README.md",              title: "Ikhtisar",              en: "Overview" },
      { file: "panduan/01_PERKENALAN.md",       title: "1. Perkenalan",         en: "1. Introduction" },
      { file: "panduan/02_INSTALASI.md",        title: "2. Instalasi",          en: "2. Installation" },
      { file: "panduan/03_PANDUAN_SINTAKS.md",  title: "3. Panduan Sintaks",    en: "3. Syntax Guide" },
      { file: "panduan/07_PUSTAKA_STANDAR.md",  title: "4. Pustaka Standar",    en: "4. Standard Library" },
      { file: "panduan/04_KONTRIBUSI.md",       title: "5. Kontribusi",         en: "5. Contributing" },
      { file: "panduan/05_CREATOR.md",          title: "6. Penulis",            en: "6. Author" },
      { file: "panduan/06_PENUTUP.md",          title: "7. Penutup & FAQ",      en: "7. Closing & FAQ" },
    ];

    // Contoh kode di-embed dari GitHub raw agar selalu sinkron dengan repo.
    const RAW_BASE = "https://raw.githubusercontent.com/teguh02/Indonesiaku/main/";

    const navEl = document.getElementById("doc-nav");
    const bodyEl = document.getElementById("doc-body");
    let currentDoc = DOCS[0].file;   // dokumen aktif (basis tautan relatif)

    // Terjemahan dari i18n.json; pakai teks cadangan bila belum termuat.
    const tr = (key, fallback) => {
      const v = window.t18n ? window.t18n(key) : key;
      return v === key ? fallback : v;
    };

    // Sidebar mobile
    const navToggle = document.getElementById("nav-toggle");
    const navPanel = document.getElementById("nav-panel");
    function tutupNavMobile() {
      if (window.matchMedia("(max-width: 1023px)").matches) {
        navPanel.classList.add("hidden");
      }
    }
    navToggle.addEventListener("click", () => navPanel.classList.toggle("hidden"));

    // Bangun sidebar (judul mengikuti bahasa aktif).
    function renderNav() {
      const lang = window.indkLang();
      navEl.textContent = "";
      DOCS.forEach((d) => {
        const a = document.createElement("a");
        a.textContent = lang === "en" ? d.en : d.title;
        a.href = "#" + d.file;
        a.dataset.file = d.file;
        a.className = "block rounded-lg px-3 py-2 text-sm font-medium text-ink-2 transition hover:bg-ink/[0.04] hover:text-ink dark:text-paper/65 dark:hover:bg-white/5 dark:hover:text-paper";
        a.addEventListener("click", (e) => {
          e.preventDefault();
          loadDoc(d.file, true);
        });
        navEl.appendChild(a);
      });
      setActive(currentDoc);
    }

    function setActive(file) {
      navEl.querySelectorAll("a").forEach((a) => {
        const on = a.dataset.file === file;
        a.classList.toggle("bg-brand-600", on);
        a.classList.toggle("text-white", on);
        a.classList.toggle("dark:bg-brand-600", on);
        a.classList.toggle("hover:bg-ink/[0.04]", !on);
        a.classList.toggle("hover:text-ink", !on);
        a.classList.toggle("text-ink-2", !on);
        a.classList.toggle("dark:text-paper/65", !on);
        a.setAttribute("aria-current", on ? "page" : "false");
      });
    }

    marked.setOptions({ gfm: true, breaks: false });

    async function fetchText(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status + " " + res.statusText);
      return res.text();
    }

    // Ganti penanda {{embed:examples/foo.idk}} → blok kode dari GitHub raw.
    async function resolveEmbeds(container) {
      const re = /\{\{\s*embed:([^}]+?)\s*\}\}/g;
      let html = container.innerHTML;
      const jobs = [];
      html = html.replace(re, (m, path) => {
        const id = "embed_" + Math.random().toString(36).slice(2);
        jobs.push({ id, path: path.trim() });
        return `<div class="embed-example" id="${id}"><div class="embed-head">${escapeHtml(path.trim())}<span>memuat…</span></div><pre><code></code></pre></div>`;
      });
      if (jobs.length) container.innerHTML = html;

      for (const job of jobs) {
        const box = document.getElementById(job.id);
        if (!box) continue;
        try {
          const code = await fetchText(RAW_BASE + job.path);
          const gh = "https://github.com/teguh02/Indonesiaku/blob/main/" + job.path;
          box.querySelector(".embed-head").innerHTML =
            `<a href="${gh}" target="_blank" rel="noopener">${escapeHtml(job.path)}</a>` +
            `<a href="${RAW_BASE + job.path}" target="_blank" rel="noopener">lihat mentah ↗</a>`;
          const codeEl = box.querySelector("code");
          codeEl.className = "language-indonesiaku";
          codeEl.textContent = code;
          hljs.highlightElement(codeEl);
        } catch (err) {
          box.querySelector(".embed-head").innerHTML =
            `${escapeHtml(job.path)} <span>gagal memuat</span>`;
          box.querySelector("code").textContent = "// gagal memuat contoh: " + err.message;
        }
      }
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // Selesaikan tautan .md relatif terhadap dokumen yang sedang dibuka.
    function resolveDocFile(href, baseFile) {
      try {
        const url = new URL(href, "http://lokal/" + baseFile);
        const path = decodeURIComponent(url.pathname).replace(/^\//, "");
        return DOCS.some((d) => d.file === path) ? path : null;
      } catch (err) {
        return null;
      }
    }

    function fixLinks(container) {
      container.querySelectorAll("a[href]").forEach((a) => {
        const href = a.getAttribute("href");
        if (!href) return;
        const target = resolveDocFile(href, currentDoc);
        if (target) {
          a.addEventListener("click", (e) => {
            e.preventDefault();
            loadDoc(target, true);
          });
          return;
        }
        if (href.startsWith("../")) {
          a.href = "https://github.com/teguh02/Indonesiaku/blob/main/" + href.replace(/^\.\.\//, "");
          a.target = "_blank";
          a.rel = "noopener";
        } else if (/^https?:\/\//.test(href)) {
          a.target = "_blank";
          a.rel = "noopener";
        }
      });
    }

    async function loadDoc(file, push) {
      currentDoc = file;
      setActive(file);
      bodyEl.innerHTML = `<p class="text-ink-3 dark:text-paper/50">${escapeHtml(tr("docs_loading", "Memuat…"))}</p>`;
      try {
        const md = await fetchText(file);
        bodyEl.innerHTML = marked.parse(md);
        await resolveEmbeds(bodyEl);
        fixLinks(bodyEl);
        bodyEl.querySelectorAll("pre code:not(.hljs)").forEach((el) => hljs.highlightElement(el));
        window.scrollTo({ top: 0, behavior: "instant" });
        if (push) history.replaceState(history.state, "", "#" + file);   // jangan hapus state Senna
        tutupNavMobile();
      } catch (err) {
        bodyEl.innerHTML =
          `<h1>${escapeHtml(tr("docs_err_title", "Gagal memuat"))}</h1>` +
          `<p>Tidak dapat memuat <code>${escapeHtml(file)}</code>: ${escapeHtml(err.message)}.</p>` +
          `<p class="text-sm">${escapeHtml(tr("docs_err_hint", "Pastikan situs diakses lewat HTTP, bukan berkas lokal."))}</p>`;
      }
    }

    renderNav();
    // Judul sidebar mengikuti bahasa; muat ulang daftar saat bahasa berubah.
    document.documentElement.addEventListener("indk:lang", renderNav);

    const start = (location.hash || "").replace(/^#/, "");
    loadDoc(DOCS.some((d) => d.file === start) ? start : DOCS[0].file, false);
    }
    var _n = 0;
    (function _tunggu() {
      if (window.marked && window.hljs) return mulai();
      if (_n++ > 50) return console.error("[docs] marked/highlight.js tidak termuat");
      setTimeout(_tunggu, 100);
    })();
    })();
  </script>
  </div><!-- /#konten -->

  <!-- ================= Senna.js: navigasi SPA =================
       Setiap halaman tetap HTML utuh dengan URL sendiri (crawlable / SEO),
       tetapi navigasi antar-halaman tidak memuat ulang seluruh dokumen.
       Surface = #konten; header/footer ikut diganti dari halaman tujuan. -->
  <script src="https://cdn.jsdelivr.net/npm/senna@2.7.3/build/globals/senna.min.js" defer></script>
  <script>
    window.addEventListener("load", function () {
      if (!window.senna) return;               // CDN gagal → situs tetap MPA biasa
      var app = new senna.App();
      window.__indkApp = app;   // untuk debugging navigasi
      app.setBasePath("/");
      app.addSurfaces("konten");
      app.addRoutes(new senna.Route(/.*/, senna.HtmlScreen));
    });
  </script>
</body>
