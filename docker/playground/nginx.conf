worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 128k;

    # Rootfs container bersifat read-only; satu-satunya direktori yang bisa
    # ditulis adalah tmpfs /var/cache/nginx. Tanpa baris ini nginx mencoba
    # mkdir /var/lib/nginx/tmp/* saat start lalu gagal total.
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    access_log /dev/stdout;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/markdown image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # API playground → layanan runner (jaringan internal).
        location /api/ {
            proxy_pass http://runner:8099;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 10s;
            proxy_connect_timeout 3s;
        }

        # Markdown dibaca fetch() oleh reader dokumentasi.
        location ~* \.md$ {
            default_type text/markdown;
            charset utf-8;
            try_files $uri =404;
        }

        location ~* \.idk$ {
            default_type text/plain;
            charset utf-8;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ $uri/index.html =404;
        }
    }
}
